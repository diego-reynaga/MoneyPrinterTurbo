name: 🐛 Informe de error
description: Informa de un error o de un comportamiento inesperado
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        **Antes de abrir una incidencia, asegúrate de haber leído la siguiente documentación: [Inicio rápido](https://github.com/harry0703/MoneyPrinterTurbo/blob/main/README.md#inicio-rápido-).**

  - type: textarea
    attributes:
      label: Comportamiento actual
      description: |
        Describe el problema que estás teniendo
      placeholder: |
        Cuando hago..., el programa muestra...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Pasos para reproducirlo
      description: |
        Describe con detalle cómo reproducir este problema
      placeholder: |
        1. Abre...
        2. Haz clic en...
        3. Aparece el error...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs de error
      description: |
        Proporciona los mensajes de error o logs relacionados (ten cuidado de no incluir información sensible)
      placeholder: |
        Mensajes de error, logs o capturas de pantalla...
    validations:
      required: true
  - type: input
    attributes:
      label: Versión de Python
      description: |
        La versión de Python que usas
      placeholder: v3.13.0, v3.10.0, etc.
    validations:
      required: true
  - type: input
    attributes:
      label: Sistema operativo
      description: |
        La información de tu sistema operativo
      placeholder: macOS 14.1, Windows 11, Ubuntu 22.04, etc.
    validations:
      required: true
  - type: input
    attributes:
      label: Versión de MoneyPrinterTurbo
      description: |
        La versión de MoneyPrinterTurbo que usas
      placeholder: v1.2.2, etc.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Información adicional
      description: |
        Cualquier otra información que pueda ayudar a resolver el problema (capturas de pantalla, vídeos, etc.)
    validations:
      required: false
