name: ✨ Solicitud de función
description: Propón una idea o sugerencia nueva para este proyecto
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: textarea
    attributes:
      label: Descripción del problema
      description: |
        Describe el problema o la necesidad que quieres resolver
      placeholder: |
        Al usar este proyecto me he encontrado con...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Solución propuesta
      description: |
        Describe la solución o la implementación que te parece viable
      placeholder: |
        Se podría añadir la función... para resolver este problema
    validations:
      required: true
