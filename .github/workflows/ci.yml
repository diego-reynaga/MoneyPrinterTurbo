name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Tests con Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MPT_TEST_REDIS_HOST: 127.0.0.1
      MPT_TEST_REDIS_PORT: 6379
      MPT_TEST_REDIS_DB: 15

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Compilar el código Python
        run: uv run --no-sync python -m compileall app cli.py main.py webui test docs/skill

      - name: Revisar el estilo del código Python
        if: matrix.python-version == '3.11'
        run: uv run --no-sync ruff check app cli.py main.py webui test docs/skill

      - name: Ejecutar los tests unitarios con cobertura
        # pytest es compatible con los unittest.TestCase existentes y además recoge los
        # tests de estilo pytest del repositorio, para que no haya archivos de test que la CI no ejecute.
        run: uv run --no-sync python -X utf8 -m coverage run -m pytest -q test

      # Se mantiene sin cambios la elección del backend multimedia portátil de la suite antigua.
      # El renderizado nativo de proyectos es una pasada obligatoria aparte tras instalar
      # las herramientas del sistema; su cobertura se añade antes de aplicar el umbral común.
      - name: Instalar FFmpeg para los tests nativos de renderizado de revisiones
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Ejecutar los tests nativos de renderizado de revisiones
        run: >-
          uv run --no-sync python -X utf8 -m coverage run --append -m pytest -q
          test/services/test_video_project.py test/services/test_minimax_output_container.py

      - name: Informar de la cobertura de los tests
        run: uv run --no-sync python -m coverage report

      - name: Exportar el informe de cobertura
        run: uv run --no-sync python -m coverage xml

      - name: Subir el informe de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  windows-smoke:
    name: Tests de humo en Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen --python 3.11

      - name: Compilar el código Python
        run: uv run --no-sync python -m compileall app cli.py main.py webui test docs/skill

      - name: Ejecutar los tests de humo de los servicios principales
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_config.py
          test/services/test_state.py
          test/services/test_task.py
          test/services/test_task_manager.py
          test/services/test_upload_post.py
          test/services/test_controller_video.py
          test/services/test_webui_task.py
          test/services/test_webui_headless_task_actions.py
          test/services/test_cache_manager.py
          test/services/test_material_cache.py
