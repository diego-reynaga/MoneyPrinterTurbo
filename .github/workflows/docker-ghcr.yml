name: Publicar la imagen de Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "README*.md"
      - "docs/**"
      - ".github/workflows/docker-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  # El GITHUB_TOKEN solo puede publicar en el registro del dueño del repositorio, así que
  # un nombre fijo de otra cuenta hacía fallar la publicación en los forks.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/moneyprinterturbo

jobs:
  publish:
    name: Construir y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer los metadatos de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y subir la imagen de Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            DOCKER_BUILD_MIRROR=default
            PIP_USE_OFFICIAL=1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
