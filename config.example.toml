# Ejemplo de configuración de MoneyPrinterTurbo.
# La aplicación copia este archivo a config.toml en el primer arranque. Guarda las claves API y demás
# credenciales en config.toml; no subas al repositorio tu config.toml local.

# =============================================================================
# Servicio de la API
# =============================================================================
# Nivel de registro: DEBUG, INFO, WARNING o ERROR.
log_level = "DEBUG"
# Usa 127.0.0.1 para acceso solo local. 0.0.0.0 escucha en todas las interfaces de red.
listen_host = "0.0.0.0"
listen_port = 8080

[diagnostics]
# Sobrescritura opcional del log_level de nivel superior, compartida por la API, la CLI y la WebUI.
# log_level = "INFO"
# El rastreo de solicitudes es independiente del nivel de registro y está desactivado por defecto.
# Registra los parámetros de las solicitudes censurados y el estado/tiempo de las respuestas, nunca los
# cuerpos de las respuestas. Los prompts pueden quedar visibles; actívalo solo mientras diagnosticas un problema.
# WebUI: Ajustes > Configuración de interfaz > Registro de diagnóstico; Aplicar tiene efecto de inmediato
# en ese proceso. Los demás procesos y las ediciones manuales del archivo requieren reiniciar.
log_requests = false

[app]

# Protección opcional de las rutas de la API y de los archivos generados en /tasks.
# Déjalo vacío para mantener el acceso local compatible sin autenticación. Si se configura, los clientes
# deben enviar el mismo valor en la cabecera x-api-key. Guarda las claves reales solo
# en config.toml y no las subas nunca al repositorio.
# Las solicitudes de artefactos de tareas también necesitan esta cabecera; la barra de direcciones del navegador no puede
# añadir cabeceras personalizadas, así que los clientes autenticados deben descargarlos por HTTP.
api_key = ""

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------

# Oculta el panel de configuración básica en la WebUI.
hide_config = false

# Backend de generación de guiones. "local" mantiene el flujo LLM existente.
# "loomloom" usa un SkillBot de LoomLoom Market configurado para devolver varios
# candidatos de guion generados de forma independiente. La integración con la WebUI es opcional.
script_generation_backend = "local"

# Ajustes de la API pública de LoomLoom. La WebUI admite de serie el SkillBot público
# de MoneyPrinterTurbo de abajo. Configura la clave en la WebUI o en un
# config.toml privado, y no subas nunca una clave real. El SkillBot fijo acepta subject,
# requirements y candidateIndex en cada fila
# y devuelve JSON en línea {script, videoTerms} en el puerto "output".
loomloom_base_url = "https://loomloom.shengsuanyun.com/loom/v1"
loomloom_api_token = ""
loomloom_request_timeout_seconds = 30
loomloom_poll_interval_seconds = 2
loomloom_run_timeout_seconds = 600
loomloom_video_run_timeout_seconds = 1800

# Tiempo de espera en segundos de una sola solicitud en streaming de Edge TTS.
# Con redes lentas se puede aumentar; 0 desactiva el tiempo de espera.
edge_tts_timeout = 30

# Verifica los certificados TLS de las API externas y de las descargas de material.
# Debería mantenerse activado; desactívalo solo temporalmente con proxies de confianza o certificados autofirmados.
tls_verify = true

# -----------------------------------------------------------------------------
# Material de vídeo
# -----------------------------------------------------------------------------

# Valores disponibles: "pexels", "pixabay", "coverr", "wavespeed",
# "volcengine_seedance", "ofox", "metaso_minimax", "muapi", "loomloom",
# "openai_image", "infistar", "local".
# "wavespeed" genera clips totalmente nuevos con los modelos de texto a vídeo de WaveSpeed AI
# en lugar de buscar material de stock; la generación se factura por solicitud.
# "loomloom" es una fuente de pago de Shengsuan Cloud y requiere confirmarlo
# explícitamente en la WebUI antes de cada solicitud de generación.
# "ofox" genera clips totalmente nuevos mediante la API de vídeo multimodelo de OFox
# (Seedance / Wan y otros modelos de texto a vídeo con una sola clave); la generación
# se factura por clip enviado.
# "openai_image" genera una imagen por cada palabra clave del guion mediante cualquier
# endpoint /images/generations compatible con OpenAI (gateways locales ComfyUI/SD
# o servicios intermedios en la nube) y la convierte en un clip de vídeo.
video_source = "pexels"

# Las listas de claves API admiten rotación de claves. Usa comillas dobles ASCII rectas y
# separa varias claves con comas, por ejemplo: ["clave-1", "clave-2"].

# Regístrate en https://www.pexels.com/api/
pexels_api_keys = []

# Regístrate en https://pixabay.com/api/docs/
pixabay_api_keys = []

# Regístrate en https://coverr.co/developers?ctx=header_navigation
coverr_api_keys = []

# WaveSpeed AI genera clips a partir de las palabras clave del guion con modelos de texto a vídeo.
# Crea una clave API en https://wavespeed.ai
wavespeed_api_keys = []
# Opcional. Aquí sirve cualquier ID de modelo de texto a vídeo de WaveSpeed que acepte
# prompt / aspect_ratio / duration.
# wavespeed_text_to_video_model = "bytedance/seedance-2.0-fast/text-to-video"
# El modelo por defecto solo acepta duraciones de 4 a 15 segundos. Las duraciones de clip
# pedidas fuera de ese rango se ajustan automáticamente antes de enviarlas
# (el material sobrante lo recorta el flujo de edición). Sobrescríbelo solo si el
# modelo elegido admite otro rango.
# wavespeed_min_duration = 4
# wavespeed_max_duration = 15

# Volcano Engine Ark Seedance usa la API oficial de generación de vídeo asíncrona.
# Crea una clave API de Ark en:
# https://console.volcengine.com/ark/region:ark+cn-beijing/apikey
# Si está vacía, se usa VOLCENGINE_ARK_API_KEY y, si no, el ajuste
# volcengine_api_key del LLM existente. Una sola variable de entorno propia del proveedor
# evita ambigüedades con otros SDK que también pueden usar nombres genéricos de Ark.
# La generación se factura por clip enviado.
volcengine_seedance_api_key = ""
volcengine_seedance_base_url = "https://ark.cn-beijing.volces.com/api/v3"
# Este modelo oficial estable admite texto a vídeo, clips de 2 a 12 segundos y 1080p.
# Puedes sustituirlo por un modelo activado o un Endpoint ID de tu cuenta de Ark.
volcengine_seedance_model = "doubao-seedance-1-0-pro-250528"
volcengine_seedance_resolution = "1080p" # "480p", "720p" o "1080p"
volcengine_seedance_min_duration = 2
volcengine_seedance_max_duration = 12
volcengine_seedance_poll_interval = 5
volcengine_seedance_run_timeout = 1800
volcengine_seedance_watermark = false

# OFox (https://ofox.ai) ofrece varios modelos de texto a vídeo (Seedance, Wan
# y más) con una sola clave API mediante una API asíncrona /v1/videos.
# Crea una clave API en https://ofox.ai
# Si está vacía, se usa la variable de entorno OFOX_API_KEY.
# La generación se factura por clip enviado.
ofox_api_key = ""
ofox_base_url = "https://api.ofox.ai/v1"
# Aquí sirve cualquier ID de modelo de texto a vídeo del catálogo de OFox (GET /v1/models).
ofox_text_to_video_model = "bytedance/seedance-2.0-fast"
# Las resoluciones admitidas dependen del modelo elegido (el modelo por defecto acepta
# "480p" y "720p"); los valores no válidos la API los rechaza con un error claro
# antes de crear ninguna tarea.
ofox_resolution = "720p"
# El modelo por defecto solo acepta duraciones de 4 a 15 segundos; otros modelos tienen
# rangos distintos (por ejemplo, alibaba/wan-2.7 acepta de 2 a 15 segundos).
# Las duraciones de clip pedidas fuera del rango se ajustan automáticamente antes de
# enviarlas (el material sobrante lo recorta el flujo de edición).
ofox_min_duration = 4
ofox_max_duration = 15
# Fijación del proveedor. Algunos modelos los sirven varios proveedores
# (por ejemplo, la serie Seedance está disponible tanto en
# "volcengine" como en "byteplus"). Cada proveedor aplica su propia política de contenido y
# disponibilidad regional. Por defecto se fija "byteplus" (el proveedor
# internacional) para tener una política de contenido coherente y un enrutamiento previsible; pon
# "volcengine" para el proveedor de China continental, o una cadena vacía "" para
# que OFox reparta la carga entre los proveedores disponibles. Los nombres de proveedor desconocidos
# los rechaza la API antes de crear ninguna tarea. Nota: la cobertura de proveedores
# depende del modelo; la fijación por defecto está pensada para la serie Seedance; al
# cambiar a un modelo que no es Seedance (p. ej. alibaba/wan-2.7), pon el proveedor
# correspondiente o una cadena vacía; si no, la API rechaza la solicitud con
# provider_type_unavailable (no se crea ninguna tarea ni se factura nada).
ofox_provider = "byteplus"
ofox_poll_interval = 5
ofox_run_timeout = 1800

# MuAPI ofrece endpoints asíncronos de texto a vídeo en su API pública.
# Crea una clave en https://muapi.ai y mantén la URL base de la API en
# https://api.muapi.ai/api/v1 (el valor del endpoint es una ruta relativa a ella).
# Si está vacía, se usa MUAPI_API_KEY. La generación se factura por clip enviado;
# la WebUI y la CLI exigen confirmar explícitamente el cobro antes de generar.
muapi_api_key = ""
muapi_base_url = "https://api.muapi.ai/api/v1"
# La ruta económica Seedance Lite acepta clips de 3 a 12 segundos y 480p/720p/1080p.
muapi_video_endpoint = "seedance-lite-t2v"
muapi_resolution = "480p"
muapi_min_duration = 3
muapi_max_duration = 12
muapi_poll_interval = 5
muapi_run_timeout = 1800

# Metaso hace de proxy de la API de vídeo asíncrona MiniMax H3 V2. Regístrate y obtén
# una clave API independiente en https://metaso.cn/minimax-h3/?s=MPT. Su clave mk-*
# pertenece a un sistema de credenciales aparte y no puede reutilizar la clave del LLM de MiniMax.
# Si este valor está vacío, se usa METASO_MINIMAX_API_KEY. La generación se factura
# por clip enviado; la WebUI y la CLI exigen confirmar explícitamente el cobro.
metaso_minimax_api_key = ""
metaso_minimax_base_url = "https://metaso.cn/api/minimax"
metaso_minimax_resolution = "2K" # "768P" o "2K"
metaso_minimax_poll_interval = 10
metaso_minimax_run_timeout = 1800

# Fuente de material de texto a imagen compatible con OpenAI ("openai_image"). Apunta la
# URL base a cualquier endpoint que hable el protocolo /images/generations de OpenAI:
# un gateway ComfyUI/SD local, un servicio intermedio autoalojado o un agregador en la nube.
# Las imágenes se generan bajo demanda (una por palabra clave del guion, facturadas por imagen
# por tu proveedor) y se convierten en clips de vídeo cortos con efecto de zoom.
# Ejemplo: "https://api.openai.com/v1" o "http://127.0.0.1:8080/v1"
# Para un servidor SDXL local gratuito, consulta docs/local-image-server/README.md.
openai_image_base_url = ""
# Opcional para gateways locales que no necesitan autenticación. Déjalo vacío para enviar las solicitudes
# sin cabecera Authorization; indica una o varias claves para servicios intermedios en la nube.
openai_image_api_keys = []
# Cualquier ID de modelo de imagen que acepte tu endpoint, por ejemplo el alias de un checkpoint
# de SD local o el nombre de modelo de un proveedor.
openai_image_model = ""
# Tamaño de imagen opcional que se envía al endpoint. La API de imágenes oficial de OpenAI solo
# acepta los tamaños que fija el modelo (p. ej. 1024x1024, 1024x1536, 1536x1024 o "auto"),
# así que por defecto se elige un tamaño compatible según la relación de aspecto del vídeo (vertical 1024x1536,
# horizontal 1536x1024, cuadrado 1024x1024). Pon un valor personalizado (p. ej. "1080x1920")
# para gateways locales que aceptan cualquier resolución.
openai_image_size = ""
# Plantilla de prompt opcional que se aplica a cada término de búsqueda. Usa el marcador "{term}"
# para insertar la palabra clave; déjala vacía para enviar los términos tal cual.
# Ejemplo: "cinematic photo of {term}, photorealistic, high detail"
openai_image_prompt_template = ""

# Integración opcional con TwelveLabs para ordenar semánticamente el material y revisar los vídeos.
# Instala la dependencia opcional con: uv sync --extra twelvelabs
# Crea una clave API en https://playground.twelvelabs.io/
twelvelabs_api_keys = []
# Reordena los términos de búsqueda con Marengo antes de descargar el material. Esta opción
# se ignora cuando match_materials_to_script está activado.
twelvelabs_rerank_terms = false
# Sobrescrituras de modelo opcionales. Descoméntalas solo si hace falta otro modelo.
# twelvelabs_marengo_model = "marengo3.0"
# twelvelabs_pegasus_model = "pegasus1.5"

# Hace coincidir los términos de búsqueda y el material descargado con el orden narrativo del guion.
# Desactivado por defecto; al activarlo se reduce la aleatoriedad y el orden del material sigue más la estructura del texto.
match_materials_to_script = false

# Música de fondo original ajustada al vídeo con Sonilo, opcional.
# Crea una clave en https://platform.sonilo.com/dashboard. La WebUI también puede guardar
# este valor, o puedes definir en su lugar la variable de entorno SONILO_API_KEY.
sonilo_api_key = ""
sonilo_base_url = "https://api.sonilo.com"
# Segundos máximos de espera cuando el flujo de una generación pasa un tiempo sin datos; no es el límite total de la solicitud.
sonilo_timeout = 600

