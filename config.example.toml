# Kimi Code (suscripción de Kimi). Sin clave API: inicia sesión una vez en el navegador desde
# Ajustes -> Configuración LLM (autorización OAuth de dispositivo, plataforma de China o
# Global) y las solicitudes usarán los límites de uso de tu plan Kimi Code. Las credenciales
# se guardan aquí automáticamente tras iniciar sesión (kimi_code_access_token /
# kimi_code_refresh_token / kimi_code_token_expires_at / kimi_code_region) y se
# renuevan de forma transparente. Deja model_name vacío para usar "kimi-for-coding".
# Deja timeout vacío para usar el valor por defecto de 300 s.
kimi_code_model_name = ""
kimi_code_timeout = ""

# OneAPI. Usa el token, la URL base y el ID de modelo de tu despliegue de OneAPI.
# Proyecto: https://github.com/songquanpeng/one-api
oneapi_api_key = ""
oneapi_base_url = ""
oneapi_model_name = ""

# LiteLLM usa las credenciales de los proveedores de las variables de entorno, como
# OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY o AWS_ACCESS_KEY_ID.
# Formatos de modelo: openai/gpt-4o, anthropic/claude-sonnet-4, ollama/llama3.
# Proveedores: https://docs.litellm.ai/docs/providers
litellm_model_name = ""

# Groq
# Clave API: https://console.groq.com/keys
groq_api_key = ""
groq_base_url = ""
groq_model_name = ""

# Pollinations AI: https://enter.pollinations.ai/
pollinations_api_key = ""
pollinations_base_url = ""
pollinations_model_name = ""

# -----------------------------------------------------------------------------
# Voz, subtítulos y vídeo
# -----------------------------------------------------------------------------

# Xiaomi MiMo TTS comparte mimo_api_key y mimo_base_url con el LLM de MiMo.
mimo_tts_model_name = "mimo-v2.5-tts"
mimo_tts_style_prompt = "Lee con un tono natural y claro, adecuado para la narración de vídeos cortos."

# Proveedor de subtítulos: "edge" o "whisper". Whisper solo se carga cuando se elige
# explícitamente; los fallos de Edge no provocan una descarga automática del modelo de Whisper.
# Déjalo vacío para no generar subtítulos.
subtitle_provider = "edge"

# FFmpeg normalmente se descarga y se detecta automáticamente. Si la detección falla,
# descárgalo de https://www.gyan.dev/ffmpeg/builds/ e indica el ejecutable.
# Ejemplo en Windows: ffmpeg_path = "C:\\ruta\\a\\ffmpeg.exe"
# ffmpeg_path = ""

# Hace fallar un montaje de FFmpeg atascado tras este número de segundos (por defecto: 3600).
# Auméntalo para vídeos especialmente largos o equipos lentos. Al agotarse el tiempo, FFmpeg
# se detiene y la tarea informa de un fallo en lugar de quedarse para siempre en el 50 %.
# ffmpeg_concat_timeout_seconds = 3600

# El MP3 sin locución y la narración con etiquetas de pausa usan FFmpeg. Cada invocación se limita para que
# una conversión atascada haga fallar la tarea en lugar de esperar indefinidamente (por defecto:
# 600 segundos por invocación). Auméntalo en equipos especialmente lentos o para
# fragmentos de narración muy largos.
# ffmpeg_tts_timeout_seconds = 600

# Búsquedas de palabras clave y descargas concurrentes de material de stock (solo Pexels, Pixabay
# y Coverr). Por defecto: 1 (en serie). Valores más altos pueden ser más rápidos pero pueden
# activar los límites de uso de los proveedores. Usa 1, 2, 4, 6 u 8: el código limita los valores a 8,
# y la WebUI restablece cualquier otro valor a 1 cuando muestra este ajuste.
# material_concurrency = 1

# Cuántos clips se recortan, se ajustan de velocidad y se codifican a la vez. Por defecto: 1
# (en serie). Valores más altos pueden ser más rápidos pero usan más CPU y memoria. Usa 1, 2,
# 4, 6 u 8: el código limita los valores a 8, y la WebUI restablece cualquier otro valor a 1.
# video_clip_concurrency = 1

# Déjalo sin definir para seguir el valor por defecto de la aplicación (libx264). Los codificadores por hardware son opcionales;
# los codificadores no admitidos vuelven automáticamente a libx264.
# Valores disponibles: "libx264", "h264_nvenc", "h264_amf", "h264_qsv",
# "h264_mf", "h264_videotoolbox".
# video_codec = "libx264"

# -----------------------------------------------------------------------------
# Almacenamiento y ejecución de tareas
# -----------------------------------------------------------------------------

# URL base pública que se usa para construir los enlaces de descarga de los vídeos generados. Déjala vacía para
# usar la dirección actual del servicio de la API, o pon la URL de un proxy inverso externo.
endpoint = ""

# Almacenamiento del material: "" usa ./storage/cache_videos, "task" guarda el material en
# el directorio de cada tarea, y una ruta absoluta lo guarda en ese directorio.
# Ejemplo: material_directory = "/ruta/a/videos"
material_directory = ""

# Estado de las tareas respaldado por Redis, opcional. Mantén Redis privado para esta aplicación;
# los escritores no fiables no deben poder modificar los registros de tareas serializados.
enable_redis = false
redis_host = "localhost"
redis_port = 6379
redis_db = 0
redis_password = ""

# Número máximo de tareas de generación de vídeo de la API concurrentes y en cola.
max_concurrent_tasks = 5
max_queued_tasks = 100

# -----------------------------------------------------------------------------
# Publicación multiplataforma
# -----------------------------------------------------------------------------

# Upload-Post puede publicar los vídeos generados en TikTok, Instagram y YouTube.
# Crea una cuenta y una clave API en https://upload-post.com/
# Documentación de la API: https://docs.upload-post.com/
upload_post_enabled = false
upload_post_api_key = ""
upload_post_username = ""
# Valores disponibles: "tiktok", "instagram", "youtube".
upload_post_platforms = ["tiktok", "instagram"]
# Publica automáticamente los vídeos generados con éxito.
upload_post_auto_upload = false
# Privacidad en YouTube: "public", "unlisted" o "private".
upload_post_youtube_privacy_status = "public"
# Declara si el vídeo está dirigido a niños. Elígelo según su público; debe ser un booleano TOML true / false.
# Si no se define, las siguientes subidas a YouTube declaran explícitamente "no dirigido a niños".
# Pon true para el contenido infantil. Los vídeos ya subidos no cambian.
upload_post_youtube_made_for_kids = false
# Número máximo de trabajos de publicación multiplataforma en ejecución y en cola por proceso. Cuando
# se alcanza el límite, la generación del vídeo sigue teniendo éxito y solo se
# rechaza la publicación.
# Los trabajos de publicación se ejecutan en el proceso actual y no se reanudan tras reiniciar.
upload_post_max_pending_tasks = 10

# =============================================================================
# Subtítulos con Whisper
# =============================================================================

[whisper]
# El modelo se descarga automáticamente la primera vez que se usa, salvo que exista un
# directorio local correspondiente en ./models/whisper-{model_size}.
model_size = "large-v3"
# device: "cpu" o "cuda". Los compute types habituales son "int8" para CPU y
# "float16" o "int8_float16" para CUDA.
device = "cpu"
compute_type = "int8"
# Prompt opcional que orienta el decodificador de Whisper hacia un vocabulario concreto
# (nombres de marca, términos técnicos). Se pasa como initial_prompt a transcribe().
# Déjalo vacío para desactivarlo.
# initial_prompt = ""

# =============================================================================
# Proxy de las solicitudes de material
# =============================================================================

[proxy]
# Proxy opcional que usan Pexels, Pixabay, Coverr y las descargas de material.
# Formato: "http://<usuario>:<contraseña>@<proxy>:<puerto>"
# Documentación: https://requests.readthedocs.io/en/latest/user/advanced/#proxies
# http = "http://127.0.0.1:3128"
# https = "http://127.0.0.1:1080"

# =============================================================================
# Proveedores de TTS
# =============================================================================

[azure]
# Credenciales de Azure Speech TTS. Son distintas de los ajustes de Azure OpenAI.
# Clave API: https://portal.azure.com/#view/Microsoft_Azure_ProjectOxford/CognitiveServicesHub/~/SpeechServices
speech_key = ""
speech_region = ""

[siliconflow]
# Clave API de SiliconFlow TTS: https://siliconflow.cn/
api_key = ""

[minimax_tts]
# Clave API: https://platform.minimax.io/user-center/basic-information/interface-key
# Endpoint global: https://api.minimax.io/v1/t2a_v2
# Endpoint de China: https://api.minimaxi.com/v1/t2a_v2
# Si api_key está vacía, se reutilizan automáticamente la clave del LLM de MiniMax y su endpoint
# regional correspondiente. Define ambos campos solo cuando el TTS use una clave aparte.
api_key = ""
base_url = ""
model_id = "speech-2.8-hd"
voice_id = "English_expressive_narrator"
sample_rate = 32000
bitrate = 128000
# Formatos de contenedor que admite la validación local: mp3, wav, flac.
# El PCM sin cabecera se rechaza antes de sintetizar.
audio_format = "mp3"
channel = 1
pitch = 0

[elevenlabs]
# Clave API: https://elevenlabs.io/app/settings/api-keys
# Las voces favoritas de la biblioteca de voces de ElevenLabs se muestran en la WebUI.
api_key = ""
# Los modelos disponibles incluyen eleven_multilingual_v2, eleven_flash_v2_5 y eleven_v3.
model_id = "eleven_multilingual_v2"
# Video-to-Music usa otra familia de modelos y comparte la misma clave API.
# music_base_url solo configura el endpoint de Video-to-Music, así que puede apuntar a
# un proxy o a un gateway autoalojado mientras la API de voz sigue usando el host por defecto.
music_base_url = "https://api.elevenlabs.io"
music_model_id = "music_v2"
music_timeout = 600

[chatterbox]
# Servidor Chatterbox TTS compatible con OpenAI. Los valores por defecto apuntan a
# travisvn/chatterbox-tts-api ejecutándose en local en el puerto 4123.
base_url = "http://127.0.0.1:4123/v1"
api_key = ""
model_id = "chatterbox"
# Nombres de voz que expone el servidor Chatterbox configurado.
voices = ["default-Female"]

[kokoro]
# Servidor Kokoro TTS compatible con OpenAI (hexgrad/Kokoro-82M, Apache-2.0, funciona en CPU).
# Los valores por defecto apuntan a remsky/Kokoro-FastAPI ejecutándose en local en el puerto 8880.
base_url = "http://127.0.0.1:8880/v1"
api_key = ""
model_id = "kokoro"
# Nombres de voz (af_heart, bf_emma, hf_alpha, ...). Déjalo vacío para leer la lista
# del servidor (GET {base_url}/audio/voices).
voices = []

[fish_audio]
# Servicio Fish Audio TTS: https://fish.audio
# Clave API: https://fish.audio/app/developers
# También puedes definir la variable de entorno FISH_API_KEY.
api_key = ""
# Modelos disponibles: "s2.1-pro-free", "s2.1-pro", "s2-pro"
model = "s2.1-pro-free"

# ── Selección de voz ─────────────────────────────────────────────────────────
# Hay de serie preajustes integrados de voces por defecto claras femenina, masculina y neutra.
# Para usar otras voces públicas o clonadas, añade entradas abajo.
# Cada entrada es:
#   "<reference_id>:<nombre_visible>"   – un ID de modelo de voz de Fish Audio con etiqueta
#   "<reference_id>"                    – ID sin más (se usa como ID y como etiqueta)
#
# Explora las voces públicas en https://fish.audio y copia el ID del modelo de la URL.
# Ejemplo: voices = ["7f92f8afb8ec43bf81429cc1c9199cb1:Narrador amable"]
voices = []

# ── Aviso sobre el modelo y los precios ──────────────────────────────────────
# El modelo "s2.1-pro-free" se ofrece según las condiciones para desarrolladores de Fish Audio y
# está sujeto a su política de uso razonable, a límites de uso y a periodos promocionales
# limitados en el tiempo (p. ej. hasta agosto de 2026). No hay SLA. Consulta
# https://fish.audio/pricing para la disponibilidad actual y las condiciones comerciales.

[voxcpm]
# TTS en la nube VoxCPM de ModelBest. Crea una clave API y elige un modelo con la
# capacidad `speech_synthesis` en https://platform.modelbest.cn/console/
# La API Audio Speech devuelve una respuesta WAV en streaming; MoneyPrinterTurbo
# la convierte automáticamente a su formato interno de locución MP3.
base_url = "https://api.modelbest.cn/v1"
api_key = ""
model_id = ""
voice_id = "default"

# =============================================================================
# Preferencias de la WebUI
# =============================================================================

[ui]
# Oculta los logs de generación en la WebUI.
hide_log = false

# Abre automáticamente la carpeta de la tarea al terminar de generar el vídeo.
# Si se desactiva, se puede seguir abriendo a mano desde la gestión de tareas.
open_task_folder_on_completion = true

# La WebUI escribe automáticamente el resto de preferencias. Descomenta los valores
# de abajo solo cuando quieras definir a mano los valores iniciales.
# language = "es"
# video_language = ""
# paragraph_number = 1
# video_script_prompt = ""
# custom_system_prompt = ""
# loomloom_candidate_count = 3
# loomloom_script_duration_seconds = 60
# loomloom_video_scene_count = 1
# video_concat_mode = "random"       # "random" o "sequential"
# video_transition_mode = "None"     # "None", "Shuffle", "FadeIn", etc.
# video_aspect_pexels = "9:16"       # Se guarda por separado para cada fuente de vídeo.
# video_fit_mode = "cover"           # "cover" rellena/recorta; "contain" añade franjas negras.
# video_clip_duration = 3
# video_clip_speed = 1.0
# video_count = 1
# tts_server = "azure-tts-v1"
# voice_name = ""
# voice_mode = "tts"                 # "tts", "upload" o "none"
# voice_volume = 1.0
# voice_rate = 1.0
# bgm_type = "random"
# bgm_volume = 0.2
# custom_bgm_file = ""
# sonilo_bgm_prompt = ""
# elevenlabs_music_prompt = ""
# subtitle_enabled = true
# subtitle_display_mode = "sentence" # "sentence" o "word_by_word"
# subtitle_animation = "none"        # "none" o "pop_spring"
# font_name = "MicrosoftYaHeiBold.ttc"
# font_size = 60
# text_fore_color = "#FFFFFF"
# stroke_color = "#000000"
# stroke_width = 1.5
# subtitle_position = "bottom" # "top", "center", "bottom", "two_thirds_bottom" o "custom"
# custom_position = 70.0       # Porcentaje desde arriba cuando se usa "custom"
# subtitle_background_enabled = false
# subtitle_background_color = "#000000"
# rounded_subtitle_background = false
