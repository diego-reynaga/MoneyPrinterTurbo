# Forma de ejecución que usa la suscripción de Claude (Pro / Max / Team) como proveedor LLM.
#
# Diferencias con docker-compose.release.yml:
#   1. Construye Dockerfile.claude, de modo que el contenedor incluye la CLI claude;
#   2. Monta todo el directorio del proyecto, para que el código del proveedor claude_code tenga efecto;
#   3. Inyecta CLAUDE_CODE_OAUTH_TOKEN; dentro del contenedor no hay keychain, así que la CLI solo puede
#      autenticarse con el token de larga duración que genera `claude setup-token`.
#
# Antes de arrancar, exporta el token:
#   export CLAUDE_CODE_OAUTH_TOKEN="$(claude setup-token)"
#   docker compose -f docker-compose.claude.yml up -d --build

x-common-build: &common-build
  context: .
  dockerfile: Dockerfile.claude

x-common-volumes: &common-volumes
  - ./:/MoneyPrinterTurbo

x-common-environment: &common-environment
  # Si no hay token, compose da error directamente, para no fallar en la fase de generación cuando el contenedor ya está en marcha.
  CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?run 'export CLAUDE_CODE_OAUTH_TOKEN="$(claude setup-token)"' first}

services:
  webui:
    build: *common-build
    container_name: "moneyprinterturbo-webui"
    ports:
      - "127.0.0.1:8501:8501"
    command: [ "streamlit", "run", "./webui/Main.py", "--server.address=0.0.0.0", "--server.port=8501", "--browser.serverAddress=127.0.0.1", "--server.enableCORS=True", "--browser.gatherUsageStats=False", "--client.toolbarMode=minimal", "--logger.hideWelcomeMessage=True", "--server.showEmailPrompt=False" ]
    volumes: *common-volumes
    environment: *common-environment
    restart: always
  api:
    build: *common-build
    container_name: "moneyprinterturbo-api"
    ports:
      - "127.0.0.1:8080:8080"
    command: [ "python3", "main.py" ]
    volumes: *common-volumes
    environment: *common-environment
    restart: always
