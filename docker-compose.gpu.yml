# Archivo de sobrescritura para GPU
# Uso: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Requisitos previos:
#   1. Controlador de GPU de NVIDIA instalado en el host
#   2. NVIDIA Container Toolkit instalado
#   3. Compruébalo con: docker info | grep nvidia
#
# Este archivo sobrescribe el docker-compose.yml por defecto para:
#   - Construir con Dockerfile.gpu (imagen base de NVIDIA CUDA)
#   - Conectar los dispositivos GPU a ambos servicios, porque la generación de vídeo puede ejecutarse
#     tanto en el proceso de la WebUI como en el de la API
services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  api:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
