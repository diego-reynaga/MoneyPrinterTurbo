# Notas:
# 1. Las dependencias principales se declaran todas en pyproject.toml.
# 2. El entorno de ejecución se fija con uv.lock, para que distintas máquinas no resuelvan combinaciones de versiones distintas.
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mpt"
version = "1.3.9"
description = "Paquete oficial de MoneyPrinterTurbo con WebUI y CLI, mantenido por harry0703."
readme = "docs/pypi-description.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "moviepy==2.2.1",
    "streamlit==1.59.1",
    # La adaptación gzip de Streamlit 1.59.1 depende del protocolo de respuesta antiguo; las versiones nuevas hacen fallar las respuestas multimedia.
    "starlette==1.2.1",
    "streamlit-tour==1.1.0",
    "edge-tts==7.3.1",
    "fastapi==0.136.3",
    "uvicorn==0.32.1",
    "openai==2.24.0",
    "faster-whisper==1.1.0",
    # Igual que en requirements.txt: PyAV 19 eliminó un parámetro que usa Whisper.
    "av<19",
    "toml==0.10.2",
    "imageio-ffmpeg==0.6.0",
    "loguru==0.7.3",
    "dashscope==1.20.14",
    "azure-cognitiveservices-speech==1.41.1",
    "redis==5.2.0",
    "python-multipart==0.0.27",
    "pyyaml==6.0.3",
    "requests==2.33.1",
    "packaging==24.2",
    "socksio==1.0.0",
    "pydub==0.25.1",
    "audioop-lts==0.2.2; python_version >= '3.13'",
    "litellm==1.86.2",
    "google-genai==2.11.0",
]

[project.scripts]
mpt = "app.launcher:main"

[project.urls]
Homepage = "https://github.com/harry0703/MoneyPrinterTurbo"
Issues = "https://github.com/harry0703/MoneyPrinterTurbo/issues"

[project.optional-dependencies]
# Integración opcional de comprensión/embeddings de vídeo de TwelveLabs (https://twelvelabs.io).
# Solo hace falta cuando se configura `twelvelabs_api_keys`; se instala
# con `uv sync --extra twelvelabs`.
twelvelabs = [
    "twelvelabs>=1.2.8",
]

[dependency-groups]
dev = [
    "coverage==7.15.1",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[tool.ruff.lint.per-file-ignores]
# La WebUI tiene que añadir primero la raíz del proyecto a sys.path para poder importar después el paquete app.
"webui/Main.py" = ["E402"]

[tool.coverage.run]
# Medir la cobertura de ramas permite detectar los casos en que "la línea se ejecutó, pero la otra rama de la condición nunca se verificó",
# y es mejor base de calidad para la CI que medir solo la cobertura de líneas. La CLI y la WebUI son entradas de producción,
# así que se incluyen en la medición junto con la capa de servicio de app, la entrada de arranque del servicio y el script de la Skill
# publicado para los usuarios de agentes, para que la cobertura no refleje solo módulos sueltos.
branch = true
source = ["app", "cli", "webui", "main", "docs/skill"]

[tool.coverage.report]
# La cobertura de ramas medida en los tests completos de Python 3.11 y 3.13 supera en ambos casos el 70,4 %. Usar el 70 %
# como mínimo estable consolida los tests de estados de fallo, recuperación de publicaciones asíncronas y actualizaciones atómicas de Redis,
# dejando a la vez margen para las pequeñas diferencias de ramas entre versiones de Python y sistemas operativos.
fail_under = 70
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["app", "webui"]

# Se conservan las fuentes por defecto para chino e inglés y la fuente vietnamita. Los dos pesos alternativos de gran tamaño no entran en el paquete,
# para que la wheel no supere el límite de tamaño de archivo por defecto de PyPI; los archivos de fuentes de la versión de código fuente no cambian.
[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "app/cli.py"
"config.example.toml" = "app/_assets/config.example.toml"
"resource/fonts/STHeitiMedium.ttc" = "app/_assets/resource/fonts/STHeitiMedium.ttc"
"resource/fonts/MicrosoftYaHeiBold.ttc" = "app/_assets/resource/fonts/MicrosoftYaHeiBold.ttc"
"resource/fonts/BeVietnamPro-Bold.ttf" = "app/_assets/resource/fonts/BeVietnamPro-Bold.ttf"
"resource/fonts/BeVietnamPro-Medium.ttf" = "app/_assets/resource/fonts/BeVietnamPro-Medium.ttf"
"resource/fonts/Charm-Bold.ttf" = "app/_assets/resource/fonts/Charm-Bold.ttf"
"resource/fonts/Charm-Regular.ttf" = "app/_assets/resource/fonts/Charm-Regular.ttf"
"resource/fonts/UTM Kabel KT.ttf" = "app/_assets/resource/fonts/UTM Kabel KT.ttf"
"resource/songs" = "app/_assets/resource/songs"
"resource/public" = "app/_assets/resource/public"

[tool.hatch.build]
exclude = ["**/.DS_Store", "**/__pycache__", "**/*.pyc", "**/.streamlit"]

[tool.hatch.build.targets.sdist]
# Se usa una lista blanca, para que la configuración local, las credenciales, storage, AGENTS.md, etc., no se cuelen en el paquete de código fuente.
include = [
    "/app", "/cli.py", "/webui", "/config.example.toml", "/pyproject.toml",
    "/uv.lock", "/LICENSE", "/docs/pypi-description.md", "/docs/packaging.md",
    "/test/services/test_packaging.py", "/resource/songs", "/resource/public",
    "/resource/fonts/STHeitiMedium.ttc", "/resource/fonts/MicrosoftYaHeiBold.ttc",
    "/resource/fonts/BeVietnamPro-Bold.ttf", "/resource/fonts/BeVietnamPro-Medium.ttf",
    "/resource/fonts/Charm-Bold.ttf", "/resource/fonts/Charm-Regular.ttf",
    "/resource/fonts/UTM Kabel KT.ttf",
]

[tool.uv]
package = true
